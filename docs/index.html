<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-src blob:; object-src 'none'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="AuditJE: journal entry testing for auditors — completeness, risk screening, sample selection and vouching, with every file saved to your own engagement folder. Runs entirely in your browser.">
<meta name="theme-color" content="#18283a">
<title>AuditJE — Journal entry testing</title>
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./assets/app.css">
<script src="./assets/vendor/exceljs.min.js" defer></script>
<script type="module" src="./assets/js/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" id="brandLink" aria-label="AuditJE home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="4" fill="none" stroke="#c9d6cd" stroke-width="2"/><path d="M8 17l5 5 11-13" fill="none" stroke="#ff7a68" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    AuditJE
  </a>
  <div class="ctx" id="ctx"></div>
  <div class="spacer"></div>
  <div class="save-state" id="saveState" hidden><span class="dot"></span><span id="saveText"></span></div>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch light or dark theme">Dark</button>
  <a class="iconbtn" href="https://github.com/Faysalahmed1994/audit-journal-entry-risk-analyzer" target="_blank" rel="noopener">Source</a>
</header>

<div id="app">
  <noscript><p style="padding:40px">AuditJE needs JavaScript. All processing happens in your browser; nothing is uploaded.</p></noscript>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle" role="dialog"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="askDlg">
  <form method="dialog">
    <h3 id="askTitle">Reason</h3>
    <label class="field"><span id="askLabel">Reason</span><textarea id="askText" required></textarea></label>
    <div class="row" style="justify-content:flex-end"><button class="btn secondary" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok" id="askOk">Save</button></div>
  </form>
</dialog>
</body>
</html>
