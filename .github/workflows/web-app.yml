name: Web App
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Engine unit tests
        run: npm test
      - name: Vendored ExcelJS matches the pinned package
        run: cmp node_modules/exceljs/dist/exceljs.min.js docs/assets/vendor/exceljs.min.js
      - run: npx playwright install --with-deps chromium
      - name: End-to-end workflow test (synthetic data)
        run: npm run test:e2e
