name: Public Preview Checks
on:
  push:
    paths:
      - 'docs/**'
      - 'tests/check_demo.js'
      - '.github/workflows/preview-checks.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/check_demo.js'
      - '.github/workflows/preview-checks.yml'
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/demo.js
      - run: node tests/check_demo.js
